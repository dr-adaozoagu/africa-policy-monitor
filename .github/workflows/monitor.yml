name: Daily policy scan

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor.py
      - name: Commit the signal note
        run: |
          git config user.name  "africa-policy-monitor"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Signal note $(date -u +%Y-%m-%d)"
          git push
